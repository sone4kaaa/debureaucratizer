[tool.poetry]
name = "debureaucratizer"
version = "0.1.0"
description = "Интеллектуальная система переписывания канцелярита на простой русский: мультиагентная архитектура + RAG"
authors = ["Student"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
aiosqlite = "^0.20"
pydantic = "^2.9"
pydantic-settings = "^2.6"
email-validator = "^2.2"
httpx = "^0.28"
qdrant-client = "^1.12"
sentence-transformers = "^3.3"
transformers = "^4.46"
torch = "^2.5"
celery = "^5.4"
redis = "^5.2"
rank-bm25 = "^0.2.2"
evaluate = "^0.4"
sacrebleu = "^2.4"
bert-score = "^0.3"
pyjwt = "^2.9"
bcrypt = "^4.2"
python-json-logger = "^2.0"
streamlit = "^1.40"
requests = "^2.32"
datasets = "^3.1"
pandas = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
pytest-mock = "^3.14"
black = "^24.10"
ruff = "^0.8"
mypy = "^1.13"
scipy = "^1.14"
krippendorff = "^0.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: интеграционные тесты",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

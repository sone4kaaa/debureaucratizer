# Полный стек «Дебюрократизатора»: Postgres + API + Celery worker + UI +
# Ollama (LLM) + Qdrant (векторный поиск) + Redis (брокер Celery).
#
# Запуск из корня репозитория:
#   cp .env.example .env
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# OLLAMA_MODEL можно переопределить в .env (по умолчанию qwen2.5:7b).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rung_user
      POSTGRES_PASSWORD: rung_password
      POSTGRES_DB: rung_db
    volumes:
      - rung_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rung_user -d rung_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rung_internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rung_internal

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - rung_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - rung_internal

  ollama:
    image: ollama/ollama:latest
    volumes:
      - rung_ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - rung_internal

  # Одноразовая задача: скачать модель после подъёма ollama.
  # Веса хранятся в томе rung_ollama_data, повторный запуск почти мгновенен.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - rung_internal

  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://rung_user:rung_password@db:5432/rung_db
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - rung_internal

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://rung_user:rung_password@db:5432/rung_db
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      ["celery", "-A", "backend.worker.celery_app", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rung_internal

  ui:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file: ../.env
    environment:
      API_URL: http://app:8000
      CORS_ORIGINS: http://localhost:8501
    command:
      [
        "streamlit",
        "run",
        "streamlit_app/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true",
        "--browser.gatherUsageStats",
        "false",
      ]
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - rung_internal

  # Reverse proxy: API доступен снаружи через http://localhost (порт 80),
  # долгие LLM-запросы выдерживает proxy_read_timeout 600s (см. nginx.conf).
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - rung_internal

volumes:
  rung_postgres_data:
  rung_qdrant_data:
  rung_ollama_data:

networks:
  rung_internal:
    driver: bridge
